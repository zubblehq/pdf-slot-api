<!doctype html>
<!--
  `dark` is the editor's theme (see src/styles/globals.css's `.dark` block): a
  neutral Figma-like palette. Set statically in the markup -- there is no
  switcher -- so the first paint is already dark and nothing flashes.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>PDF Slot Editor</title>
    <meta name="description" content="Add text anywhere on a PDF or document image, then download it." />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
