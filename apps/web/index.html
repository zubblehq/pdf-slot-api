<!doctype html>
<!--
  No theme class here. The editor follows the viewer's preference
  (src/app/theme/useSystemTheme.ts) rather than being fixed dark, so that it
  behaves the way it will inside elli-ui, where their switcher sets this class
  and there are four themes rather than two.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>PDF Slot Editor</title>
    <meta name="description" content="Add text anywhere on a PDF or document image, then download it." />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
